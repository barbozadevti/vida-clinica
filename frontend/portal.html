<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vida+ Clínica — Portal do Paciente</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    .portal-shell { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
    .portal-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .portal-brand { font-weight:700; font-size:16px; color: var(--primary); }
    .doc-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <form id="portal-login-form" class="login-card">
      <h1>💠 Vida+ Clínica</h1>
      <p class="muted">Portal do paciente — seus agendamentos e documentos</p>
      <label>CPF<input name="cpf" type="text" required placeholder="Só números" /></label>
      <label>Data de nascimento<input name="data_nascimento" type="date" required /></label>
      <button class="btn" type="submit">Entrar</button>
      <p id="login-erro" class="erro" hidden></p>
      <p class="muted" style="margin-top:14px;font-size:12.5px">Use o CPF e a data de nascimento cadastrados na clínica.
        Precisa de ajuda? Fale com a recepção.</p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">💠 Vida+ Clínica — Portal</div>
      <nav></nav>
      <div class="user"><span id="user-info"></span><button id="sair" class="btn ghost small">Sair</button></div>
    </header>
    <main class="portal-shell" id="view"></main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn">&times;</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/assets/js/portal.js"></script>
</body>
</html>

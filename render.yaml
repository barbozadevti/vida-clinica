# Blueprint do Render: New + -> Blueprint -> este repositório -> Apply.
databases:
  - name: esus-db
    plan: free
    databaseName: esus
    user: esus

services:
  - type: web
    name: esus-ubs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MIN
        value: "480"
